{% extends "base.html" %}
{% block titre %}Erreur {{ code }}{% endblock %}
{% block contenu %}
<div class="error_section">
    {{ image('images/error.png', "illustration pour la page d'erreur", "") }}
    <h1 style="text-align: center;">{{ message }}</h1>
    <p>Erreur {{ code }}. Vérifiez l'adresse ou revenez à l'accueil.</p>
    <p><a class="bouton" href="{{ url_for('accueil') }}">Retour à l'accueil</a></p>
</div>
{% endblock %}
